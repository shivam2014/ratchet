<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="flow-title flow-desc">
  <title id="flow-title">How Ratchet runs: contract, guard, tool call, check, done, CI</title>
  <desc id="flow-desc">A contract feeds an in-loop guard that allows or denies tool calls, and an out-of-loop check that produces evidence for done and CI.</desc>
  <rect width="1200" height="380" rx="24" fill="#0A0B0D"/>
  <rect x="0.75" y="0.75" width="1198.5" height="378.5" rx="23.25" fill="none" stroke="#1E2126" stroke-width="1.5"/>

  <text x="64" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="2.2" fill="#7BE0A3">HOW IT RUNS</text>
  <text x="64" y="84" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="26" font-weight="600" fill="#F4F1EA">One contract. Two enforcers.</text>

  <text x="64" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="1.4" fill="#6F7680">IN-LOOP  ·  FAST FEEDBACK</text>
  <text x="64" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="1.4" fill="#6F7680">OUT-OF-LOOP  ·  AUTHORITY</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect x="64" y="128" width="240" height="80" rx="12" fill="#101216" stroke="#24272D" stroke-width="1.5"/>
    <text x="84" y="160" font-size="21" fill="#F4F1EA">contract.json</text>
    <text x="84" y="186" font-size="15" fill="#9AA0A8">scope · budgets</text>

    <rect x="480" y="128" width="240" height="80" rx="12" fill="#101216" stroke="#24272D" stroke-width="1.5"/>
    <text x="500" y="160" font-size="21" fill="#F4F1EA">ratchet guard</text>
    <text x="500" y="186" font-size="15" fill="#9AA0A8">path · scope</text>

    <rect x="896" y="128" width="240" height="80" rx="12" fill="#101216" stroke="#24272D" stroke-width="1.5"/>
    <text x="916" y="160" font-size="21" fill="#F4F1EA">tool call</text>
    <text x="916" y="186" font-size="15" fill="#9AA0A8">write · edit · bash</text>

    <rect x="64" y="256" width="240" height="80" rx="12" fill="#101216" stroke="#24272D" stroke-width="1.5"/>
    <text x="84" y="288" font-size="21" fill="#F4F1EA">ratchet check</text>
    <text x="84" y="314" font-size="15" fill="#9AA0A8">exit codes = evidence</text>

    <rect x="480" y="256" width="240" height="80" rx="12" fill="#101216" stroke="#24272D" stroke-width="1.5"/>
    <text x="500" y="288" font-size="21" fill="#F4F1EA">ratchet done</text>
    <text x="500" y="314" font-size="15" fill="#9AA0A8">no evidence, no done</text>

    <rect x="896" y="256" width="240" height="80" rx="12" fill="#101216" stroke="#24272D" stroke-width="1.5"/>
    <text x="916" y="288" font-size="21" fill="#F4F1EA">git + CI</text>
    <text x="916" y="314" font-size="15" fill="#9AA0A8">required checks</text>
  </g>

  <g stroke="#3A3F46" stroke-width="1.5" fill="none">
    <line x1="304" y1="168" x2="464" y2="168"/>
    <path d="M458 162 L470 168 L458 174" fill="#3A3F46" stroke="none"/>
    <line x1="720" y1="168" x2="880" y2="168"/>
    <path d="M874 162 L886 168 L874 174" fill="#3A3F46" stroke="none"/>

    <line x1="304" y1="296" x2="464" y2="296"/>
    <path d="M458 290 L470 296 L458 302" fill="#3A3F46" stroke="none"/>
    <line x1="720" y1="296" x2="880" y2="296"/>
    <path d="M874 290 L886 296 L874 302" fill="#3A3F46" stroke="none"/>
  </g>

  <text x="384" y="156" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#9AA0A8">allow / deny</text>
  <text x="384" y="284" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#9AA0A8">evidence</text>

  <text x="64" y="362" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" fill="#9AA0A8">The guard is fast feedback. The check and CI are the authority.</text>
</svg>
